# Current grooves runtime / project shape (v1.5 — implemented).
# Next: config/target-shape.yaml (scenes[]). Ephemeral omitted: playhead, viewport,
# buffers, routing graph, library.kits, armed/playing flags.

format: grooves-project
version: 1.5
name: example
lang: en

transport:
  bpm: 120
  timeSignature: [4, 4]
  resolution: 16

# -----------------------------------------------------------------------------
# tracks — strip / mixer axis (same as target; content still on-track)
# -----------------------------------------------------------------------------

tracks:
  - id: drums
    type: sample-seq
    name: Drums
    midi:
      channel: 10
    channel:                    # was partMixer
      volume: 1
      muted: false
      solo: false
      pan: 0.5
      sends:
        reverb: 0
        delay: 0
    # Row defs — was assignments + rowParams (stable ids).
    rows:
      - id: kick
        name: Kick
        midi: { note: 36 }
        sample: { kit: basic_drum_kit, file: PD-KICK-03.wav }
        inserts: { vcf: { cutoff: 1, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
      - id: snare
        name: Snare
        midi: { note: 38 }
        sample: { kit: basic_drum_kit, file: Rpeople_Snare3.wav }
        inserts: { vcf: { cutoff: 1, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
      - id: hat
        name: Hat
        midi: { note: 42 }
        sample: { kit: basic_drum_kit, file: HCR-01.wav }
        inserts: { vcf: { cutoff: 1, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
      - id: row-3
        name: Row 4
        midi: { note: 45 }
        sample: null
        inserts: { vcf: { cutoff: 1, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
    # Live pattern — stays on track until scenes[] (target).
    # measures[bar][rowId][localStep]; steps = per bar.
    pattern:
      steps: 16
      measures:
        - kick: { 0: true, 4: true, 8: true, 12: true }
          snare: { 4: true, 12: true }
          hat: {
            0: true, 2: true, 4: true, 6: true, 8: true, 10: true, 12: true, 14: true
          }
          row-3: {}
        - kick: { 0: true, 4: true, 8: true, 12: true }
          snare: { 4: true, 12: true }
          hat: {
            0: true, 2: true, 4: true, 6: true, 8: true, 10: true, 12: true, 14: true
          }
          row-3: {}
        - kick: { 0: true, 4: true, 8: true, 12: true }
          snare: { 4: true, 12: true }
          hat: {
            0: true, 2: true, 4: true, 6: true, 8: true, 10: true, 12: true, 14: true
          }
          row-3: {}
        - kick: { 0: true, 4: true, 8: true, 12: true }
          snare: { 4: true, 8: true, 10: true, 12: true }
          hat: {
            0: true, 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true,
            8: true, 9: true, 10: true, 11: true, 12: true, 14: true
          }
          row-3: {}

  - id: trk-loops
    type: loop
    name: Loops
    channel:                    # was track.mixer
      volume: 1
      muted: false
      solo: false
      pan: 0.5
      sends:
        reverb: 0
        delay: 0
    loop:
      inputId: default
      clickEnabled: true
    # Slot defs + live payloads together until scenes[] splits them.
    slots:
      - id: slot-0
        name: Slot 1
        process: idle
        sample: { kit: basic_loops, file: loop-a.wav }
        sourceBpm: 120
        layers: 1
        duration: 2.0             # 1 bar @ 120
        inserts: { vcf: { cutoff: 0.64, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
        volume: 0.85
        muted: false
      - id: slot-1
        name: Slot 2
        process: idle
        sample: null
        media: media/loops/slot-1.wav
        sourceBpm: 120
        layers: 1
        duration: 4.0             # 2 bars @ 120
        inserts: { vcf: { cutoff: 0.64, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
        volume: 0.85
        muted: false
      - id: slot-2
        name: Slot 3
        process: empty
        sample: null
        sourceBpm: null
        layers: 0
        duration: 0
        inserts: { vcf: { cutoff: 0.64, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
        volume: 0.85
        muted: false
      - id: slot-3
        name: Slot 4
        process: empty
        sample: null
        sourceBpm: null
        layers: 0
        duration: 0
        inserts: { vcf: { cutoff: 0.64, resonance: 0 } }
        sends: { reverb: 0, delay: 0 }
        volume: 0.85
        muted: false

mixer:
  master:
    volume: 1
  buses:
    reverb:
      seconds: 3
      decay: 2
    delay:
      time: 0.375
      feedback: 0.35

# -----------------------------------------------------------------------------
# ui — layout only (not DAW Structure / not track content)
# -----------------------------------------------------------------------------
# Ephemeral omitted: playhead, cuedBar, viewport, buffers, routing,
# library.kits, armed/playing transport flags.

ui:
  activeWorkspace: drums
  workspacesStripOpen: true
  library:
    path: [library, loops, basic_loops]
  drums:
    selectedRow: null
    currentBar: 0
    measuresExpanded: true
    panels: { library: false, settings: false }
  loops:
    selectedSlot: null
    panels: { library: false, settings: false }

# -----------------------------------------------------------------------------
# → target (v2)
# -----------------------------------------------------------------------------
# Lift tracks[].pattern / slot payloads → scenes[0].clips[track=…].
# tracks[] keep channel + rows/slots defs only. Prefer library paths for samples.
